# smart-analytics 反向代理配置
# ---------------------------------------------------------------------------
# 这是【新增】的 server 块文件，单独放一份，不修改 HabitHero 现有的任何
# nginx 配置。部署方式（二选一）：
#   A. 放到 /etc/nginx/conf.d/smart-analytics.conf（推荐，自动被 http 块 include）
#   B. 在现有 nginx 主配置里 `include` 本文件路径
# 放好后执行： sudo nginx -t && sudo systemctl reload nginx
# ---------------------------------------------------------------------------

# 方案 A（推荐）：独立子域名，例如 analytics.yourdomain.com
# 优点：与 HabitHero 完全路径隔离，最干净，也符合 Plausible/Umami 等分析工具惯例。
server {
    listen 80;
    server_name analytics.example.com;   # ← 改成你的实际域名（需先配好 DNS A 记录）

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}

# 方案 B（备选，同域名子路径）：若不想加子域名，可用 /analytics/ 前缀。
# 注意：需同步给 smart-analytics 设 root_path（FastAPI --root-path /analytics），
# 且前端追踪脚本的 base 也要相应调整。生产一般更推荐方案 A，故此处仅作参考。
