<nav>
  <div class="nav-brand">
    <a href="/" class="brand-logo" aria-label="smart-analytics 首页">📈</a>
    <a href="/" class="brand-name">smart-analytics</a>
    {% if brand %}
    <div class="brand-site-wrap">
      <button type="button" class="brand-site" id="brandSiteBtn" aria-haspopup="true" aria-expanded="false" aria-label="切换站点">
        <span class="bs-text">/ {{ brand }}</span><span class="bs-caret" aria-hidden="true">▾</span>
      </button>
      {% if sites %}
      <div class="brand-site-menu" id="brandSiteMenu" role="menu" hidden>
        {% for s in sites %}
        <a href="/switch-site?site={{ s.id }}" role="menuitem" class="bs-item{% if site and s.id == site.id %} is-current{% endif %}">
          <span class="bs-name">{{ s.name }}</span>
          {% if site and s.id == site.id %}<span class="bs-check" aria-hidden="true">✓</span>{% endif %}
        </a>
        {% endfor %}
      </div>
      {% endif %}
    </div>
    {% endif %}
  </div>

  <div class="nav-right">
    <div class="links" id="nav-links">
      <div class="drawer-head">
        <span class="drawer-title">菜单</span>
        <button type="button" class="drawer-close" aria-label="关闭菜单">✕</button>
      </div>
      <div class="nav-group">
        <a href="/" {% if active == "dashboard" %}class="active"{% endif %}>仪表盘</a>
        <a href="/logs" {% if active == "logs" %}class="active"{% endif %}>访问日志</a>
        <a href="/sites" {% if active == "sites" %}class="active"{% endif %}>管理站点</a>
        <a href="/settings" {% if active == "settings" %}class="active"{% endif %}>设置</a>
        {% include "_site_switcher.html" %}
      </div>
      <div class="nav-actions">
        {% include "theme_toggle.html" %}
        <a href="/logout" class="logout-link">退出</a>
      </div>
    </div>

    <div class="nav-top">
      <button type="button" class="nav-toggle" aria-label="打开菜单" aria-expanded="false" aria-controls="nav-links"></button>
    </div>
  </div>

  <div class="nav-backdrop" id="nav-backdrop"></div>
</nav>
