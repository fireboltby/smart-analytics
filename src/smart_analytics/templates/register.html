{% extends "base.html" %}

{% block title %}smart-analytics - 注册{% endblock %}

{% block body %}
<div class="login-container">
  <h2>创建账户</h2>
  {% if closed %}
    <p class="login-alt">注册已关闭。请联系管理员获取账户。</p>
  {% else %}
    {% if error %}<p class="login-error">{{ error }}</p>{% endif %}
    <form method="post" action="/register">
      <input type="email" name="email" placeholder="邮箱" value="{{ email or '' }}" required autofocus>
      <input type="password" name="password" placeholder="密码（至少 6 位）" required minlength="6">
      <input type="password" name="password_confirm" placeholder="确认密码" required minlength="6">
      <button type="submit">注册并进入</button>
    </form>
    <p class="login-alt">已有账户？<a href="/login">去登录</a></p>
  {% endif %}
</div>
{% endblock %}
