<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}smart-analytics 网站分析{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
  <script>
    // 无闪烁：在 CSS 应用前设定主题（默认保持当前深色外观）
    (function () {
      try {
        var t = localStorage.getItem('sa-theme');
        if (t !== 'light' && t !== 'dark') t = 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="stylesheet" href="/static/css/style.css?v=46">
  {% block head %}{% endblock %}
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="page-shell">
    {% block body %}{% endblock %}
  </div>
  {% block scripts %}{% endblock %}
  <script>
    // 主题切换：胶囊滑块开关，localStorage 持久化，跨页与多标签页同步
    (function () {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      function sync() {
        var t = document.documentElement.getAttribute('data-theme');
        if (t !== 'light' && t !== 'dark') t = 'dark';
        btn.setAttribute('data-theme', t);
        btn.title = (t === 'light') ? '切换到暗色模式' : '切换到浅色模式';
      }
      sync();
      btn.addEventListener('click', function () {
        var cur = document.documentElement.getAttribute('data-theme');
        var next = (cur === 'light') ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('sa-theme', next); } catch (e) {}
        sync();
        if (typeof window.__rerenderCharts === 'function') window.__rerenderCharts();
      });
      window.addEventListener('storage', function (e) {
        if (e.key === 'sa-theme' && e.newValue) {
          document.documentElement.setAttribute('data-theme', e.newValue);
          sync();
          if (typeof window.__rerenderCharts === 'function') window.__rerenderCharts();
        }
      });
    })();
  </script>
  <script>
    // 移动端导航浮层抽屉：切换展开/收起，遮罩点击与 Esc 关闭，并同步无障碍状态
    (function () {
      var nav = document.querySelector('nav');
      if (!nav) return;
      var btn = nav.querySelector('.nav-toggle');
      var links = nav.querySelector('.links');
      var backdrop = nav.querySelector('.nav-backdrop');
      if (!btn || !links) return;
      function setOpen(open) {
        nav.classList.toggle('nav-open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        btn.setAttribute('aria-label', open ? '关闭菜单' : '打开菜单');
      }
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        setOpen(!nav.classList.contains('nav-open'));
        // 抽屉滑入/滑出会改变可用宽度，动画结束后再触发图表重绘
        if (typeof window.__resizeAllCharts === 'function') {
          setTimeout(window.__resizeAllCharts, 320);
        }
      });
      // 点击遮罩空白处关闭
      if (backdrop) {
        backdrop.addEventListener('click', function () { setOpen(false); });
      }
      // 抽屉内「✕ 关闭」按钮
      var closeBtn = nav.querySelector('.drawer-close');
      if (closeBtn) {
        closeBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          setOpen(false);
        });
      }
      // 点击菜单内任意链接后自动收起（移动端体验）
      links.addEventListener('click', function (e) {
        if (e.target.closest('a')) setOpen(false);
      });
      // Esc 关闭，符合无障碍预期
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && nav.classList.contains('nav-open')) setOpen(false);
      });
      // 回到桌面宽度时复位，避免展开状态残留
      window.addEventListener('resize', function () {
        if (window.innerWidth > 560 && nav.classList.contains('nav-open')) setOpen(false);
      });
    })();
  </script>
  <script>
    // 顶栏站点名(brand-site)点击展开/收起站点下拉，与抽屉内站点选择器功能一致
    (function () {
      var btn = document.getElementById('brandSiteBtn');
      var menu = document.getElementById('brandSiteMenu');
      if (!btn || !menu) return;
      function setOpen(open) {
        menu.hidden = !open;
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        btn.classList.toggle('open', open);
      }
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        setOpen(menu.hidden);
      });
      // 点击菜单内部不冒泡关闭，点击菜单项(<a>)会触发导航跳转
      menu.addEventListener('click', function (e) { e.stopPropagation(); });
      document.addEventListener('click', function () { setOpen(false); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
    })();
  </script>
  <script src="https://analytics.fireboltby.top/s/6f8f6319197b8ab96866dcec0fcd24ed.js" defer></script>
  <script>
    // 暗色模式星空背景：固定 canvas 垫在内容之下，仅在 data-theme="dark" 时显形并闪烁
    (function () {
      var canvas = document.getElementById('starfield');
      if (!canvas || !canvas.getContext) return;
      var ctx = canvas.getContext('2d');
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var stars = [], raf = null, running = false, start = 0, rt = null;
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function isDark() {
        var t = document.documentElement.getAttribute('data-theme');
        return t !== 'light';
      }

      function build() {
        var w = window.innerWidth, h = window.innerHeight;
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        var count = Math.min(260, Math.floor((w * h) / 7000));
        stars = [];
        for (var i = 0; i < count; i++) {
          stars.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: Math.random() * 1.3 + 0.3,
            base: Math.random() * 0.5 + 0.25,
            tw: Math.random() * 1.6 + 0.4,
            ph: Math.random() * Math.PI * 2,
            big: Math.random() < 0.06
          });
        }
      }

      function draw(ts) {
        var w = window.innerWidth, h = window.innerHeight;
        ctx.clearRect(0, 0, w, h);
        for (var i = 0; i < stars.length; i++) {
          var s = stars[i];
          var a = reduce ? s.base
            : s.base * (0.45 + 0.55 * (0.5 + 0.5 * Math.sin(ts * 0.001 * s.tw + s.ph)));
          if (s.big) {
            ctx.globalAlpha = a * 0.5;
            ctx.fillStyle = '#9ecbff';
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r * 3.2, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = a;
          ctx.fillStyle = '#eaf2ff';
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function loop(ts) {
        if (!running) return;
        if (!start) start = ts;
        draw(ts);
        raf = requestAnimationFrame(loop);
      }

      function startAnim() {
        if (running || !isDark()) return;
        running = true;
        start = 0;
        if (reduce) { draw(0); return; }
        raf = requestAnimationFrame(loop);
      }

      function stopAnim() {
        running = false;
        if (raf) cancelAnimationFrame(raf);
        raf = null;
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      }

      build();
      startAnim();

      window.addEventListener('resize', function () {
        clearTimeout(rt);
        rt = setTimeout(function () { build(); if (!running && isDark()) startAnim(); }, 200);
      });
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) stopAnim(); else startAnim();
      });
      // 跟随主题切换：暗色启动、浅色清除
      if (window.MutationObserver) {
        new MutationObserver(function (m) {
          for (var i = 0; i < m.length; i++) {
            if (m[i].attributeName === 'data-theme') {
              if (isDark()) startAnim(); else stopAnim();
            }
          }
        }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
      }
    })();
  </script>
</body>
</html>
